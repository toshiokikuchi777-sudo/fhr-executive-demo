<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182e31">
  <meta name="description" content="全店舗の状況から改善アクション、効果検証まで。架空データを使ったFHR経営コンソールのプレゼンテーションデモ。">
  <title>FHR 経営コンソール | Presentation Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">メインコンテンツへ</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="#overview" class="brand" aria-label="FHR 経営概況"><span class="brand-mark">fhr<span>.</span></span><span class="brand-caption">MANAGEMENT<br>INTELLIGENCE</span></a>
      <div class="workspace"><span class="workspace-icon">F</span><div>FHR Group<small>経営者コンソール</small></div></div>
      <p class="nav-label">MANAGEMENT</p>
      <nav id="navigation" aria-label="メインメニュー">
        <button type="button" data-view="overview"><span>01</span>経営概況</button>
        <button type="button" data-view="stores"><span>02</span>店舗の課題</button>
        <button type="button" data-view="actions"><span>03</span>改善アクション</button>
        <button type="button" data-view="impact"><span>04</span>効果を考える</button>
        <button type="button" data-view="rollout"><span>05</span>導入プラン</button>
      </nav>
      <div class="sidebar-bottom"><div class="profile-avatar">経</div><div>経営者ビュー<small>全店舗の集計を表示</small></div></div>
      <div class="sidebar-note">CONCEPT DEMO<br>DESIGNED BY MASTAR DESIGN</div>
    </aside>
    <div class="app-body">
      <header class="topbar"><div class="breadcrumb">FHR Group <span>/</span> <strong id="breadcrumb-current">経営概況</strong></div><div class="topbar-actions"><span class="demo-pill">架空データ · 未接続</span><button type="button" id="tour-start" class="button primary compact">3分プレゼン開始 <span aria-hidden="true">↗</span></button></div></header>
      <main id="main"></main>
      <footer class="app-footer"><span>2026年9月の架空実績 · 3店舗 · 通貨 MYR（RM）</span><button type="button" id="reset-demo" class="text-button">デモをリセット</button></footer>
    </div>
  </div>
  <div id="tour" class="tour-bar" hidden aria-label="プレゼン操作">
    <div class="tour-copy"><span id="tour-count">01 / 05</span><div><strong id="tour-title"></strong><p id="tour-note"></p></div></div>
    <div class="tour-controls"><button type="button" id="tour-prev" class="button">前へ</button><button type="button" id="tour-next" class="button primary">次へ →</button><button type="button" id="tour-close" class="text-button">終了</button></div>
  </div>
  <dialog id="action-dialog" aria-labelledby="action-dialog-title">
    <form id="action-form">
      <div class="dialog-top"><span class="eyebrow">ACTION PLAN</span><button type="button" id="dialog-close" class="icon-button" aria-label="閉じる">×</button></div>
      <h2 id="action-dialog-title">店舗Bのフォローを、実行へ。</h2>
      <p class="muted">未対応12件の状況を確認し、必要なフォローを店舗で判断します。</p>
      <label class="field">担当責任者<select name="owner"><option>店舗B 責任者</option><option>本部 運営担当</option></select></label>
      <label class="field">確認期限<input type="date" name="due" value="2026-10-21" min="2026-10-14" max="2026-12-31" required></label>
      <div class="form-note">登録はこのデモ内のみ。スタッフへの通知や外部への送信は行いません。</div>
      <button type="submit" class="button primary full-width">デモ内のアクションに追加</button>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>この操作デモを表示するには、ブラウザーでJavaScriptを有効にしてください。</noscript>
</body>
</html>
